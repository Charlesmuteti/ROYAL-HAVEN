<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Charles Website - Videos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #a09494;
        }

        nav {
            height: 75px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
        }

        .logo {
            color: #d4af37;
            font-size: 25px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: rgb(244, 177, 33);
            text-decoration: none;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* HEADER */
        header {
            background: #111827;
            color: rgb(225, 191, 19);
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        /* NAVIGATION */
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* VIDEO SECTION */
        .video-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* VIDEO BOX */
        .video-box {
            background: white;
            padding: 10px;
            border-radius: 10px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        video {
            width: 100%;
            height: 300px;

            display: block;

            background: black;
            border-radius: 8px;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;

            padding: 20px;
            margin-top: 40px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav a {
                margin: 0 7px;
                font-size: 14px;
            }

            .video-container {
                grid-template-columns: 1fr;
            }

            video {
                height: 250px;
            }
        }
    </style>
</head>

    <!-- JAVASCRIPT -->

    <script>

        const videos = document.querySelectorAll(".myVideo");

        videos.forEach(function (video) {

            video.addEventListener("timeupdate", function () {

                if (video.currentTime >= 60) {

                    video.currentTime = 60;

                    video.pause();

                }

            });


            video.addEventListener("seeking", function () {

                if (video.currentTime > 60) {

                    video.currentTime = 60;

                }

            });

        });
